# Bảng từ khoá cho bộ đọc CV theo luật (services/extraction/rules/). Muốn nhận thêm một cách viết: thêm vào đây.
# Mọi từ khoá viết KHÔNG DẤU, chữ thường (bộ đọc bỏ dấu + hạ chữ trước khi so khớp). Không ghi dữ liệu ứng viên.
# Đổi file này -> phiên bản bộ đọc (metadata PDF) đổi theo mã băm.

version = "1"

# ---------------------------------------------------------------------------
# Tiêu đề mục: [headings.<khoá>] type = loại mục theo schema; vi/en = các cách viết
# type "personal" = khối thông tin cá nhân (không thành mục trong PDF, chỉ lấy năm sinh/giới tính/mong muốn)
# type "auto" = chọn theo nội dung (có mốc thời gian -> experience, không -> bullets)
# ---------------------------------------------------------------------------
[headings.summary]
type = "text"
vi = ["muc tieu nghe nghiep", "muc tieu cong viec", "muc tieu", "gioi thieu ban than", "gioi thieu", "tom tat",
      "tom tat ban than", "tong quan", "ve toi", "dinh huong nghe nghiep", "thong tin chung", "tom tat nang luc",
      "tom tat kinh nghiem"]
en = ["career objective", "objective", "objectives", "summary", "professional summary", "profile", "about me",
      "career summary", "personal profile"]

[headings.highlights]
type = "bullets"
vi = ["thanh tich noi bat", "diem noi bat", "thanh tuu", "thanh tich", "giai thuong", "danh hieu",
      "giai thuong va thanh tich", "thanh tich va giai thuong"]
en = ["key achievements", "achievements", "highlights", "awards", "honors", "honors and awards"]

[headings.competencies]
type = "bullets"
vi = ["nang luc cot loi", "nang luc chuyen mon", "nang luc", "diem manh", "the manh"]
en = ["core competencies", "competencies", "strengths", "key strengths"]

[headings.skills]
type = "bullets"
vi = ["ky nang", "ky nang chuyen mon", "ky nang mem", "cac ky nang", "ky nang lam viec", "ky nang va cong cu",
      "ky nang khac", "ky nang ca nhan"]
en = ["skills", "key skills", "soft skills", "professional skills", "skills and tools"]

[headings.tools]
type = "tags"
vi = ["tin hoc", "cong cu", "phan mem", "cong nghe", "tin hoc van phong", "cong cu phan mem", "ky nang tin hoc"]
en = ["tools", "software", "it skills", "technical skills", "computer skills"]

[headings.languages]
type = "bullets"
vi = ["ngoai ngu", "ngon ngu", "trinh do ngoai ngu"]
en = ["languages", "language skills", "foreign languages"]

[headings.career_path]
type = "career_path"
vi = ["lo trinh su nghiep", "lo trinh nghe nghiep", "lo trinh thang tien"]
en = ["career path", "career progression"]

[headings.experience]
type = "experience"
vi = ["kinh nghiem lam viec", "kinh nghiem", "qua trinh lam viec", "qua trinh cong tac", "lich su lam viec",
      "kinh nghiem chuyen mon", "qua trinh cong viec"]
en = ["work experience", "experience", "employment history", "professional experience", "working experience",
      "work history", "employment"]

[headings.projects]
type = "auto"
vi = ["du an", "du an tieu bieu", "du an da tham gia", "du an da thuc hien"]
en = ["projects", "key projects", "project experience"]

[headings.education]
type = "education"
vi = ["hoc van", "trinh do hoc van", "qua trinh hoc tap", "dao tao", "hoc van va dao tao", "trinh do chuyen mon",
      "hoc van va chung chi", "hoc van - chung chi", "trinh do hoc van va qua trinh hoc tap",
      "chung chi va dao tao", "dao tao va chung chi", "bang cap", "chung chi", "chung chi - bang cap",
      "bang cap - chung chi", "bang cap va chung chi", "chung chi va bang cap", "khoa hoc", "cac khoa hoc"]
en = ["education", "academic background", "education and training", "certifications", "certificates",
      "licenses and certifications", "education and certifications", "courses", "training"]

[headings.activities]
type = "bullets"
vi = ["hoat dong", "hoat dong ngoai khoa", "hoat dong xa hoi", "hoat dong tinh nguyen"]
en = ["activities", "extracurricular activities", "volunteer", "volunteering"]

[headings.interests]
type = "bullets"
vi = ["so thich", "so thich ca nhan"]
en = ["interests", "hobbies"]

[headings.other]
type = "bullets"
vi = ["thong tin them", "thong tin khac", "thong tin bo sung"]
en = ["additional information", "other information"]

[headings.references]
type = "references"
vi = ["nguoi tham chieu", "nguoi tham khao", "tham chieu", "nguoi gioi thieu"]
en = ["references", "reference"]

# Mục "công việc mong muốn" (vị trí, hình thức, nơi làm, lương mong muốn) -> dòng "Mong muốn", không thành mục
[headings.desired]
type = "personal"
vi = ["cong viec mong muon", "thong tin cong viec mong muon", "nguyen vong", "nguyen vong cong viec",
      "mong muon cong viec", "vi tri mong muon", "vi tri ung tuyen"]
en = ["desired job", "type of job", "job expectation", "job expectations", "career expectation", "desired position"]

[headings.personal]
type = "personal"
vi = ["thong tin ca nhan", "thong tin lien he", "lien he", "thong tin lien lac", "ho so ca nhan"]
en = ["personal information", "personal details", "contact", "contact information", "contact details",
      "personal info"]

