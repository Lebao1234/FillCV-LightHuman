# Reverse proxy cho web app "Hồ sơ ứng viên – Light Human" (Starlette API + React).
# Dùng trong docker-compose.yml (service "nginx"); app nằm ở http://app:8000 trong mạng Docker.
#
# Vì sao cần: app KHÔNG có đăng nhập riêng, nên nginx là lớp xác thực (basic auth) phía trước.
# Tạo file mật khẩu trước khi chạy (xem README, mục "Chạy bằng Docker"): nginx/.htpasswd

upstream fillcv_app {
    server app:8000;
    keepalive 16;
}

# IP thật của người dùng khi đi qua Cloudflare Tunnel: cloudflared gửi request từ máy này/mạng Docker,
# kèm header CF-Connecting-IP. Chỉ tin header khi request đến từ các dải nội bộ dưới đây
# (cổng 80 chỉ mở cho 127.0.0.1 nên người ngoài không giả được header). Thiếu phần này thì mọi
# nhân viên dùng CHUNG một hạn mức limit_req vì nginx chỉ thấy một IP nội bộ.
real_ip_header    CF-Connecting-IP;
set_real_ip_from  127.0.0.1;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.65.0/24;

# Giữ đúng giao thức gốc (https) khi đi qua Cloudflare; chạy thẳng trên máy thì dùng $scheme
map $http_x_forwarded_proto $fillcv_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Giới hạn tần suất trích xuất CV theo IP (tránh spam / làm nghẽn hàng đợi trích xuất)
limit_req_zone $binary_remote_addr zone=cv_extract_limit:10m rate=15r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    # Phải >= MAX_UPLOAD_MB (mặc định 20) + phần đầu multipart; đổi MAX_UPLOAD_MB thì đổi cả ở đây
    client_max_body_size 21m;

    # Header bảo mật cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Đăng nhập cho toàn bộ app — ĐANG TẮT TẠM THỜI (app mở cho bất kỳ ai vào được cổng 80).
    # Bật lại: bỏ comment 2 dòng dưới + dòng mount .htpasswd trong docker-compose.yml, tạo nginx/.htpasswd (xem README).
    # auth_basic           "Light Human - Ho so ung vien";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # Healthcheck không cần đăng nhập (dùng cho docker / giám sát)
    location = /health {
        auth_basic off;
        proxy_pass http://fillcv_app;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # Tuyến đường Server-Sent Events (SSE): tắt hoàn toàn đệm để stream tức thời
    location /api/cv/extract {
        limit_req zone=cv_extract_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://fillcv_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fillcv_forwarded_proto;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://fillcv_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fillcv_forwarded_proto;

        # Tải CV lên: gửi thẳng tới app, không ghi tạm ra đĩa của nginx
        proxy_request_buffering off;
        # Dựng PDF bằng Chromium có thể mất vài chục giây khi đang xếp hàng
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

