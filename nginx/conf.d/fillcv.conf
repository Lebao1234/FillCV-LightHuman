# Reverse proxy cho app Streamlit "Hồ sơ ứng viên – Light Human".
# Dùng trong docker-compose.yml (service "nginx"); app nằm ở http://app:8501 trong mạng Docker.
#
# Vì sao cần: app KHÔNG có đăng nhập riêng, nên nginx là lớp xác thực (basic auth) phía trước.
# Tạo file mật khẩu trước khi chạy (xem README, mục "Chạy bằng Docker"): nginx/.htpasswd

# Streamlit dùng WebSocket (/_stcore/stream): chuyển tiếp header Upgrade/Connection
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fillcv_app {
    server app:8501;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    # Phải >= MAX_UPLOAD_MB (mặc định 20) + phần đầu multipart; đổi MAX_UPLOAD_MB thì đổi cả ở đây
    client_max_body_size 21m;

    # Header bảo mật cơ bản (không đặt CSP: Streamlit dùng script inline + Google Fonts)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Đăng nhập cho toàn bộ app
    auth_basic           "Light Human - Ho so ung vien";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Healthcheck không cần đăng nhập (dùng cho docker / giám sát)
    location = /_stcore/health {
        auth_basic off;
        proxy_pass http://fillcv_app;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # WebSocket của Streamlit: giữ kết nối lâu, không đệm
    location /_stcore/stream {
        proxy_pass http://fillcv_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://fillcv_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tải CV lên: gửi thẳng tới app, không ghi tạm ra đĩa của nginx
        proxy_request_buffering off;
        # Dựng PDF bằng Chromium có thể mất vài chục giây khi đang xếp hàng
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

