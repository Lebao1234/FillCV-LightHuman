# Hồ sơ ứng viên – Light Human (Docker)
# Chạy (từ thư mục gốc repo): docker compose up -d --build
# Truy cập: http://<máy chủ>/ (qua nginx, có đăng nhập). Cần tạo nginx/.htpasswd trước — xem README.
# Mã nguồn + Dockerfile nằm trong system/; dữ liệu xuất/log nằm ở data/ của thư mục gốc.

services:
  app:
    build: ./system
    container_name: fillcv-lighthuman
    restart: unless-stopped
    # Chỉ mở trong mạng Docker cho nginx; KHÔNG publish 8501 ra máy chủ (app không có đăng nhập).
    # Cần gỡ lỗi trực tiếp trên máy chủ thì thêm: ports: ["127.0.0.1:8501:8501"]
    expose:
      - "8501"
    volumes:
      # Giữ PDF đã xuất và log giữa các lần chạy
      - ./data/output:/app/data/output
      - ./data/logs:/app/data/logs
      # Đổi cấu hình công ty / từ khoá mà không cần build lại
      - ./system/config:/app/config:ro
      - ./system/assets:/app/assets:ro
    environment:
      # Bộ trích xuất: "rules" (đọc PDF theo luật) hoặc "manual" (nhập tay)
      - CV_EXTRACTOR=rules
      # Hàng đợi
      - RENDER_MAX_CONCURRENT=2
      - EXTRACT_MAX_CONCURRENT=2
      # Tự xoá PDF sau N ngày (0 = không xoá)
      - OUTPUT_RETENTION_DAYS=30
    mem_limit: 4g
    # Chromium cần shared memory lớn hơn mặc định Docker (64MB)
    shm_size: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Reverse proxy + đăng nhập (basic auth) phía trước app. Cấu hình: nginx/conf.d/fillcv.conf
  nginx:
    image: nginx:1.28-alpine
    container_name: fillcv-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # bật khi dùng HTTPS (xem cuối nginx/conf.d/fillcv.conf)
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # (Tuỳ chọn) Cloudflare Tunnel — mở app cho mạng, có xác thực qua Cloudflare Access
  # Bỏ comment phần dưới và điền TUNNEL_TOKEN để dùng. Trên dashboard Cloudflare, trỏ service tới http://nginx:80
