# Hồ sơ ứng viên – Light Human (Docker)
# Chạy (từ thư mục gốc repo): docker compose up -d --build
# Truy cập: http://localhost/ (qua nginx). Đăng nhập basic auth ĐANG TẮT TẠM THỜI nên cổng 80 chỉ mở cho máy này;
# bật lại: xem ghi chú trong nginx/conf.d/fillcv.conf và mục "Chạy bằng Docker" của README.
# Mã nguồn nằm trong system/ và web/; Dockerfile nằm ở gốc repo; dữ liệu xuất/log nằm ở data/ của thư mục gốc.

services:
  app:
    build: .
    container_name: fillcv-lighthuman
    restart: unless-stopped
    # Chỉ mở trong mạng Docker cho nginx; KHÔNG publish 8000 ra máy chủ (app không có đăng nhập).
    # Cần gỡ lỗi trực tiếp trên máy chủ thì thêm: ports: ["127.0.0.1:8000:8000"]
    expose:
      - "8000"
    volumes:
      # Giữ PDF đã xuất và log giữa các lần chạy
      - ./data/output:/app/data/output
      - ./data/logs:/app/data/logs
      # Đổi cấu hình công ty / từ khoá mà không cần build lại
      - ./system/config:/app/config:ro
      - ./system/assets:/app/assets:ro
      # Mô hình dịch máy offline (vi -> en); thư mục này không nằm trong image
      - ./data/models:/app/data/models:ro
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      # Bộ trích xuất: "rules" (đọc PDF theo luật) hoặc "manual" (nhập tay)
      - CV_EXTRACTOR=rules
      # Hàng đợi
      - RENDER_MAX_CONCURRENT=2
      - EXTRACT_MAX_CONCURRENT=2
      # Dịch máy offline hai chiều: Opus-MT vi-en (CC-BY 4.0) + en-vi (Apache-2.0). Không dùng NLLB-200 (CC-BY-NC: cấm thương mại)
      - CV_TRANSLATOR=nmt
      - TRANSLATE_MODEL_DIR=data/models/opus-mt-vi-en
      - TRANSLATE_MODEL_DIR_EN_VI=data/models/opus-mt-en-vi
      # Tự xoá PDF sau N ngày (0 = không xoá)
      - OUTPUT_RETENTION_DAYS=30
      - HOST=0.0.0.0
      - PORT=8000
    mem_limit: 4g
    # Chromium cần shared memory lớn hơn mặc định Docker (64MB)
    shm_size: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Reverse proxy + đăng nhập (basic auth) phía trước app. Cấu hình: nginx/conf.d/fillcv.conf
  nginx:
    image: nginx:1.28-alpine
    container_name: fillcv-nginx
    restart: unless-stopped
    ports:
      # Đăng nhập đang tắt tạm thời -> chỉ mở cổng 80 cho chính máy này. Bật lại đăng nhập rồi mới đổi về "80:80".
      - "127.0.0.1:80:80"
      # - "443:443"   # bật khi dùng HTTPS (xem cuối nginx/conf.d/fillcv.conf)
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro   # bật lại cùng auth_basic trong nginx/conf.d/fillcv.conf
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # (Tuỳ chọn) Cloudflare Tunnel — mở app cho mạng, có xác thực qua Cloudflare Access
  # Bỏ comment phần dưới và điền TUNNEL_TOKEN để dùng. Trên dashboard Cloudflare, trỏ service tới http://nginx:80
  #
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: fillcv-tunnel
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - app
