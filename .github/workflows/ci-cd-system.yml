# Đặt tại: .github/workflows/ci-cd-web-app.yml  (chú ý đúng tên thư mục "workflows")
#
# Quy ước: mã nguồn, Dockerfile và requirements*.txt nằm trong system/; README, docs/,
# docker-compose.yml nằm ở thư mục gốc. Các job Python chạy với working-directory: system.
# Nếu đổi tên thư mục, sửa: defaults.run.working-directory, cache-dependency-path, hashFiles,
# đường dẫn coverage.xml / data/ và context của Docker.
#
# Luồng:
#   hygiene ─┐
#   lint    ─┤
#   test    ─┼─> docker (build + smoke test; chỉ đẩy lên GHCR khi push vào main) ─> deploy (tùy chọn)
#   render  ─┘
name: CI-CD web-app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Có commit mới trên cùng nhánh/PR thì hủy lượt chạy cũ (không hủy lượt trên main để khỏi đứt deploy).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Quyền tối thiểu mặc định; job nào cần thêm thì tự khai báo.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"   # khớp với image trong Dockerfile

jobs:
  # ------------------------------------------------------------------
  # 1. Vệ sinh repo: không để lọt dữ liệu CV thật, .env, khóa bí mật
  # ------------------------------------------------------------------
  hygiene:
    name: Vệ sinh repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Không được commit dữ liệu thật hoặc bí mật
        run: |
          set -u
          bad=$(git ls-files | grep -E '(^|/)\.env(\.|$)|(^|/)data/|(^|/)private_samples/|\.(pem|key)$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Các file sau không được nằm trong repo:"
            echo "$bad"
            exit 1
          fi

      - name: Không có file PDF ngoài assets/docs/fixtures
        run: |
          bad=$(git ls-files '*.pdf' | grep -Ev '(^|/)(assets|docs|tests/fixtures)/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Phát hiện PDF có thể là CV thật:"
            echo "$bad"
            exit 1
          fi

  # ------------------------------------------------------------------
  # 2. Lint (ruff)
  # ------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: system/requirements*.txt

      - run: python -m pip install ruff

      - name: Kiểm tra lỗi code
        run: ruff check .

      # Mới áp dụng nên để cảnh báo. Khi code đã được format xong (ruff format .), bỏ dòng continue-on-error.
      - name: Kiểm tra định dạng
        run: ruff format --check .
        continue-on-error: true

  # ------------------------------------------------------------------
  # 3. Test nhanh (không cần Chromium) + coverage
  #    pytest trả mã lỗi 5 khi "no tests ran" => job sẽ đỏ, không im lặng như trước.
  # ------------------------------------------------------------------
  test:
    name: Test nhanh
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: system/requirements*.txt

      - run: python -m pip install -r requirements-dev.txt

      - name: Chạy test (bỏ qua test Chromium)
        run: python -m coverage run -m pytest -q -m "not slow" -W error::ResourceWarning

      - name: Báo cáo coverage
        if: always()
        run: |
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          python -m coverage xml || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: system/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------
  # 4. Test render PDF bằng Chromium thật (chậm hơn)
  # ------------------------------------------------------------------
  render:
    name: Test render PDF (Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: system/requirements*.txt

      - name: Font và công cụ PDF (SKILL.md yêu cầu Liberation Serif, scan_pdf cần pdftotext/pdffonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation poppler-utils

      - run: python -m pip install -r requirements-dev.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('system/requirements*.txt') }}

      - run: python -m playwright install --with-deps chromium

      - name: Chạy test chậm
        run: python -m pytest -q -m slow

      # Khi test so ảnh PDF thất bại, giữ lại file để xem
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-output
          path: |
            system/data/
            system/tests/_output/
          if-no-files-found: ignore
          retention-days: 3

  # ------------------------------------------------------------------
  # 5. Quét lỗ hổng thư viện (khuyến nghị, chưa chặn pipeline)
  # ------------------------------------------------------------------
  audit:
    name: Quét lỗ hổng thư viện
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: python -m pip install pip-audit

      # Để continue-on-error cho đến khi bạn xử lý hết cảnh báo ban đầu, rồi bỏ dòng này để chặn.
      - run: pip-audit -r requirements.txt
        continue-on-error: true

  # ------------------------------------------------------------------
  # 6. Build Docker + smoke test; push vào main thì đẩy lên GHCR (private theo repo)
  # ------------------------------------------------------------------
  docker:
    name: Build và đẩy ảnh Docker
    needs: [hygiene, lint, test, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Chuẩn hóa tên ảnh (GHCR bắt buộc chữ thường)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build ảnh để kiểm tra
        uses: docker/build-push-action@v6
        with:
          context: ./system
          load: true
          push: false
          tags: cv-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ENTRYPOINT của Dockerfile đã đặt --server.address=0.0.0.0 để container nhận kết nối;
      # cổng chỉ được mở cho 127.0.0.1 của runner.
      - name: Smoke test (health check)
        run: |
          docker run -d --name cv-app \
            -p 127.0.0.1:8501:8501 \
            cv-app:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then ok=1; break; fi
            sleep 2
          done
          docker logs cv-app
          docker rm -f cv-app
          [ "$ok" = "1" ] || { echo "::error::Container không phản hồi health check"; exit 1; }

      - name: Đăng nhập GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tạo tag
        id: meta
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v6
        with:
          images:
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Đẩy ảnh lên GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./system
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ------------------------------------------------------------------
  # 7. Deploy lên máy chủ (TẮT mặc định)
  #    Bật khi đã có VPS: Settings > Secrets and variables > Actions
  #      Variables: DEPLOY_ENABLED = true
  #      Secrets:   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
  #    Settings > Environments > production: bật "Required reviewers" để có bước duyệt tay.
  #    Trên VPS cần: docker login ghcr.io (bằng token chỉ có quyền read:packages)
  #    và thư mục /opt/cv-app chứa docker-compose.yml trỏ tới ảnh GHCR.
  # ------------------------------------------------------------------
  deploy:
    name: Deploy lên máy chủ
    needs: [docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: 'production'
    steps:
      - name: Triển khai qua SSH
        
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/cv-app && docker compose pull && docker compose up -d && docker image prune -f"